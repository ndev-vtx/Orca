# Auto Release
# Builds BOTH release artifacts on every push to main and publishes them to a
# GitHub Release tagged v<version> (version read from frontend/package.json):
#   Android APK  — Capacitor build (Orca_Latest.apk / Orca_v<version>.apk)
#   Windows EXE  — Electron wrapper around the live Orca web app
#                  (Orca_Latest.exe / Orca_v<version>.exe)
# Signed release APK when keystore secrets exist (ANDROID_KEYSTORE_B64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD);
# otherwise falls back to a debug-signed APK that is still fully installable.
# The release body carries [skip ci] and the job skips such commits so the
# release push can never re-trigger the workflow.

name: Auto Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          VERSION_CODE=$(( $(echo "$VERSION" | cut -d. -f1) * 10000 + $(echo "$VERSION" | cut -d. -f2) * 100 + $(echo "$VERSION" | cut -d. -f3) ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Orca v$VERSION (versionCode $VERSION_CODE)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json

      # Capacitor 7's capacitor-android module compiles with source release
      # 21 — Java 21 is required (Java 17 fails with "invalid source release").
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ubuntu-latest ships the Android SDK preinstalled (ANDROID_HOME set,
      # licenses pre-accepted) — no setup-android action needed, and that
      # action's sdkmanager license prompt can fail the job.

      - name: Install dependencies
        run: |
          npm ci || npm install
          (cd frontend && npm ci || npm install)

      - name: Build web app
        env:
          # Optional: baked into the /auth/google bridge page as a fallback
          # when /api/auth/providers is unreachable. The client id is public
          # by design (safe to embed); leave the secret unset to rely on the
          # backend endpoint alone.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: (cd frontend && npm run build)

      - name: Sync Capacitor into Android project
        run: npx cap sync android

      - name: Stamp Android version from package.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          grep -n "version" android/app/build.gradle | head -3

      - name: Decode release keystore (if secrets exist)
        id: keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orca-release.keystore"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble signed release APK
        if: steps.keystore.outputs.present == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PORCA_UPLOAD_STORE_FILE="$RUNNER_TEMP/orca-release.keystore" \
            -PORCA_UPLOAD_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PORCA_UPLOAD_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PORCA_UPLOAD_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Assemble debug APK (fallback)
        if: steps.keystore.outputs.present != 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p output
          SRC=android/app/build/outputs/apk/release/app-release.apk
          [ -f "$SRC" ] || SRC=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$SRC"
          cp "$SRC" "output/Orca_v${VERSION}.apk"
          cp "output/Orca_v${VERSION}.apk" output/Orca_Latest.apk
          ls -la output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-assets
          path: output/*.apk
          if-no-files-found: error

  exe:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Orca Windows wrapper v$VERSION"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop wrapper dependencies
        working-directory: desktop
        run: npm ci

      # electron-builder names artifacts from desktop/package.json — stamp it
      # from the app version so the wrapper can never drift out of sync.
      - name: Stamp wrapper version from package.json
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('desktop/package.json','utf8'));p.version=process.argv[1];fs.writeFileSync('desktop/package.json',JSON.stringify(p,null,2)+'\n');" "$VERSION"
          node -p "'desktop wrapper version: '+require('./desktop/package.json').version"

      - name: Build Windows EXE (portable + NSIS installer)
        working-directory: desktop
        env:
          # Keep electron-builder quiet but informative; skip code signing
          # (no certificate configured — portable/NSIS exes work unsigned).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Prepare EXE assets
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p output
          # Portable build is the headline download (single-file, no install);
          # the NSIS setup exe is uploaded alongside it.
          test -f "desktop/dist/Orca_Portable_${VERSION}.exe"
          cp "desktop/dist/Orca_Portable_${VERSION}.exe" "output/Orca_v${VERSION}.exe"
          cp "desktop/dist/Orca_Portable_${VERSION}.exe" output/Orca_Latest.exe
          if [ -f "desktop/dist/Orca_Setup_${VERSION}.exe" ]; then
            cp "desktop/dist/Orca_Setup_${VERSION}.exe" output/Orca_Setup_v${VERSION}.exe
          fi
          ls -la output

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe-assets
          path: |
            output/*.exe
          if-no-files-found: error

  release:
    needs: [apk, exe]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK assets
        uses: actions/download-artifact@v4
        with:
          name: apk-assets
          path: assets

      - name: Download EXE assets
        uses: actions/download-artifact@v4
        with:
          name: exe-assets
          path: assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          TAG="v${VERSION}"
          TITLE="Auto Release v${VERSION}"
          BODY="Auto-build: Update Android_APK and Windows_EXE to v${VERSION} [skip ci]"
          ls -la assets
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/Orca_Latest.apk "assets/Orca_v${VERSION}.apk" \
              assets/Orca_Latest.exe "assets/Orca_v${VERSION}.exe" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$BODY" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              assets/Orca_Latest.apk "assets/Orca_v${VERSION}.apk" \
              assets/Orca_Latest.exe "assets/Orca_v${VERSION}.exe" \
              --title "$TITLE" --notes "$BODY" --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY"
          fi
