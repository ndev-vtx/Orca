<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/orca-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/orca-icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Orca — a deep, floating ocean of music. Stream instantly, keep your library close."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Orca</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /*
       * Android APK (Capacitor) only, injected before the app bundle: pin
       * document.visibilityState/hidden to "visible" and swallow
       * visibilitychange so the YouTube IFrame player never treats a locked
       * screen or backgrounded app as a reason to pause audio. The native
       * MediaPlaybackService (foreground + wake lock) keeps the process and
       * WebView timers alive. In ordinary browsers window.Capacitor is
       * undefined and this block is inert.
       */
      (function () {
        try {
          if (
            !window.Capacitor ||
            typeof window.Capacitor.isNativePlatform !== "function" ||
            !window.Capacitor.isNativePlatform()
          ) {
            return;
          }
          Object.defineProperty(document, "hidden", { get: function () { return false; }, configurable: true });
          Object.defineProperty(document, "webkitHidden", { get: function () { return false; }, configurable: true });
          Object.defineProperty(document, "visibilityState", { get: function () { return "visible"; }, configurable: true });
          document.addEventListener(
            "visibilitychange",
            function (e) { e.stopImmediatePropagation(); },
            true
          );
        } catch (err) {
          /* never break the app over a visibility pin */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
